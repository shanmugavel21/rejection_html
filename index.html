<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Butterfly QC Rejection Report</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 10px;
            background: #f5f5f5;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        h1 {
            text-align: center;
            font-size: 23px;
            margin: 8px 0 15px;
        }

        .controls {
            background: white;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .control-row {
            display: flex;
            gap: 10px;
        }

        .control {
            flex: 1;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }

        input,
        select {
            width: 100%;
            padding: 9px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 11px;
            border: none;
            border-radius: 7px;
            font-size: 15px;
            cursor: pointer;
        }

        .daily-btn {
            margin-top: 10px;
            background: #0d6efd;
            color: white;
        }

        .save-btn {
            margin-top: 12px;
            background: #198754;
            color: white;
        }

        .delete-btn {
            margin-top: 10px;
            background: #dc3545;
            color: white;
        }

        .table-container {
            overflow-x: auto;
            background: white;
            border-radius: 8px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 7px;
        }

        th {
            background: #eeeeee;
            text-align: center;
            position: sticky;
            top: 0;
        }

        td:first-child {
            text-align: left;
        }

        td:not(:first-child) {
            text-align: center;
        }

        .number-input {
            width: 65px;
            text-align: center;
            padding: 7px;
            margin: 0;
        }

        .message {
            padding: 11px;
            margin-top: 8px;
            border-radius: 7px;
            display: none;
            text-align: center;
            font-weight: bold;
        }

        .success {
            background: #d1e7dd;
        }

        .error {
            background: #f8d7da;
        }

        .total-box {
            background: white;
            padding: 14px;
            margin-top: 12px;
            border-radius: 10px;
            text-align: center;
            font-size: 19px;
            font-weight: bold;
        }

        .loading {
            text-align: center;
            padding: 20px;
            font-weight: bold;
        }

        @media (max-width: 600px) {

            body {
                padding: 7px;
            }

            h1 {
                font-size: 20px;
            }

            .control-row {
                flex-direction: column;
                gap: 7px;
            }

            table {
                font-size: 13px;
            }

            th,
            td {
                padding: 6px;
            }

            .number-input {
                width: 55px;
            }
        }

    </style>

</head>


<body>

<div class="container">

    <h1>🏭 Butterfly QC Rejection Report</h1>


    <!-- DATE + SHIFT -->

    <div class="controls">

        <div class="control-row">

            <div class="control">

                <label>Date</label>

                <input
                    type="date"
                    id="reportDate"
                >

            </div>


            <div class="control">

                <label>Shift</label>

                <select id="shift">

                    <option value="1st Shift">
                        1st Shift
                    </option>

                    <option value="General Shift">
                        General Shift
                    </option>

                    <option value="2nd Shift">
                        2nd Shift
                    </option>

                </select>

            </div>

        </div>


        <button
            class="daily-btn"
            onclick="showDailyTotal()"
        >
            📊 Show Daily Total
        </button>

    </div>


    <!-- TABLE -->

    <div
        id="tableContainer"
        class="table-container"
    >
        <div class="loading">
            Loading...
        </div>
    </div>


    <!-- SAVE -->

    <button
        class="save-btn"
        onclick="saveData()"
    >
        💾 Save Rejection Data
    </button>


    <!-- MESSAGE BELOW SAVE BUTTON -->

    <div
        id="message"
        class="message"
    ></div>


    <!-- DELETE -->

    <button
        class="delete-btn"
        onclick="deleteData()"
    >
        🗑️ Delete Date + Shift Data
    </button>


    <!-- DAILY TOTAL -->

    <div
        id="totalContainer"
        class="total-box"
        style="display:none;"
    ></div>

</div>


<script>


// ==================================================
// SET TODAY
// ==================================================

document.getElementById("reportDate").value =
    new Date().toISOString().split("T")[0];


// ==================================================
// MESSAGE
// ==================================================

function showMessage(message, success = true) {

    const box =
        document.getElementById("message");

    box.textContent = message;

    box.className =
        "message " +
        (success ? "success" : "error");

    box.style.display = "block";
}


// ==================================================
// AUTOMATIC LOAD
// ==================================================

async function loadData() {

    const date =
        document.getElementById("reportDate").value;

    const shift =
        document.getElementById("shift").value;


    if (!date) {
        return;
    }


    document.getElementById(
        "tableContainer"
    ).innerHTML = `
        <div class="loading">
            Loading...
        </div>
    `;


    try {

        const response =
            await fetch(
                `/rejections?report_date=${date}&shift=${encodeURIComponent(shift)}`
            );


        const result =
            await response.json();


        let html = `

            <table>

                <thead>

                    <tr>

                        <th>Fault</th>

                        <th>Supplier</th>

                        <th>Process</th>

                    </tr>

                </thead>

                <tbody>

        `;


        // ------------------------------------------
        // FAULTS ONLY
        // NO SECTION HEADINGS
        // ------------------------------------------

        result.data.forEach(row => {

            html += `

                <tr>

                    <td>
                        ${escapeHtml(row.fault_name)}
                    </td>

                    <td>

                        <input
                            class="number-input supplier-input"
                            type="number"
                            min="0"
                            value="${row.supplier || 0}"
                        >

                    </td>

                    <td>

                        <input
                            class="number-input process-input"
                            type="number"
                            min="0"
                            value="${row.process || 0}"
                        >

                    </td>

                </tr>

            `;

        });


        html += `

                </tbody>

            </table>

        `;


        document.getElementById(
            "tableContainer"
        ).innerHTML = html;


        document.getElementById(
            "totalContainer"
        ).style.display = "none";


        setupEnterNavigation();


    }

    catch (error) {

        showMessage(
            "Error loading data: " +
            error.message,
            false
        );

    }

}


// ==================================================
// ENTER → DOWN SAME COLUMN
// ==================================================

function setupEnterNavigation() {

    const rows =
        document.querySelectorAll(
            "tbody tr"
        );


    rows.forEach((row, index) => {

        const inputs =
            row.querySelectorAll(
                ".number-input"
            );


        inputs.forEach(input => {

            input.addEventListener(
                "keydown",
                function(event) {

                    if (event.key !== "Enter") {
                        return;
                    }


                    event.preventDefault();


                    // --------------------------------
                    // Find current column
                    // --------------------------------

                    const currentCell =
                        input.closest("td");

                    const currentColumn =
                        currentCell.cellIndex;


                    // --------------------------------
                    // Move DOWN same column
                    // --------------------------------

                    for (
                        let nextRowIndex = index + 1;
                        nextRowIndex < rows.length;
                        nextRowIndex++
                    ) {

                        const nextInput =
                            rows[
                                nextRowIndex
                            ].querySelectorAll(
                                ".number-input"
                            )[currentColumn - 1];


                        if (nextInput) {

                            nextInput.focus();
                            nextInput.select();

                            return;
                        }

                    }

                }
            );

        });

    });

}


// ==================================================
// ESCAPE HTML
// ==================================================

function escapeHtml(text) {

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


// ==================================================
// SAVE DATA
// ==================================================

async function saveData() {

    const date =
        document.getElementById(
            "reportDate"
        ).value;

    const shift =
        document.getElementById(
            "shift"
        ).value;


    if (!date) {

        showMessage(
            "Please select date.",
            false
        );

        return;
    }


    const rows = [];


    const tableRows =
        document.querySelectorAll(
            "tbody tr"
        );


    tableRows.forEach(row => {

        const faultCell =
            row.querySelector("td:first-child");


        if (!faultCell) {
            return;
        }


        const fault =
            faultCell.textContent.trim();


        const inputs =
            row.querySelectorAll(
                ".number-input"
            );


        const supplier =
            parseInt(inputs[0].value) || 0;


        const process =
            parseInt(inputs[1].value) || 0;


        rows.push({

            fault_name: fault,

            supplier: supplier,

            process: process

        });

    });


    try {

        const response =
            await fetch(
                "/save",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        report_date: date,

                        shift: shift,

                        data: rows

                    })

                }
            );


        const result =
            await response.json();


        if (result.success) {

            showMessage(
                "✅ Data saved successfully",
                true
            );

        }
        else {

            showMessage(
                result.message,
                false
            );

        }

    }

    catch (error) {

        showMessage(
            "Save error: " +
            error.message,
            false
        );

    }

}


// ==================================================
// DAILY TOTAL
// ==================================================

async function showDailyTotal() {

    const date =
        document.getElementById(
            "reportDate"
        ).value;


    if (!date) {

        showMessage(
            "Please select date.",
            false
        );

        return;
    }


    try {

        const response =
            await fetch(
                `/daily-total?report_date=${date}`
            );


        const result =
            await response.json();


        let html = `

            <table>

                <thead>

                    <tr>

                        <th>Fault</th>

                        <th>Daily Total</th>

                    </tr>

                </thead>

                <tbody>

        `;


        result.data.forEach(row => {

            html += `

                <tr>

                    <td>
                        ${escapeHtml(row.fault_name)}
                    </td>

                    <td>
                        ${row.daily_total}
                    </td>

                </tr>

            `;

        });


        html += `

                </tbody>

            </table>

        `;


        document.getElementById(
            "tableContainer"
        ).innerHTML = html;


        const totalBox =
            document.getElementById(
                "totalContainer"
            );


        totalBox.textContent =
            `📊 Total Daily Rejection: ${result.total}`;


        totalBox.style.display =
            "block";


        document.getElementById(
            "message"
        ).style.display = "none";


    }

    catch (error) {

        showMessage(
            "Daily total error: " +
            error.message,
            false
        );

    }

}


// ==================================================
// DELETE DATA
// ==================================================

async function deleteData() {

    const date =
        document.getElementById(
            "reportDate"
        ).value;

    const shift =
        document.getElementById(
            "shift"
        ).value;


    if (!date) {

        showMessage(
            "Please select date.",
            false
        );

        return;
    }


    const confirmed =
        confirm(
            `Delete all data for ${date} | ${shift}?`
        );


    if (!confirmed) {
        return;
    }


    try {

        const response =
            await fetch(
                `/delete?report_date=${date}&shift=${encodeURIComponent(shift)}`,
                {
                    method: "DELETE"
                }
            );


        const result =
            await response.json();


        if (result.success) {

            showMessage(
                result.message,
                true
            );

            loadData();

        }
        else {

            showMessage(
                result.message,
                false
            );

        }

    }

    catch (error) {

        showMessage(
            "Delete error: " +
            error.message,
            false
        );

    }

}


// ==================================================
// AUTOMATIC LOAD WHEN PAGE OPENS
// ==================================================

window.addEventListener(
    "DOMContentLoaded",
    function() {

        loadData();

    }
);


// ==================================================
// AUTOMATIC LOAD WHEN DATE CHANGES
// ==================================================

document.getElementById(
    "reportDate"
).addEventListener(
    "change",
    function() {

        loadData();

    }
);


// ==================================================
// AUTOMATIC LOAD WHEN SHIFT CHANGES
// ==================================================

document.getElementById(
    "shift"
).addEventListener(
    "change",
    function() {

        loadData();

    }
);


</script>

</body>

</html>
